# Codex 项目级配置
# 位置：<项目根>/.codex/config.toml
# 仅在该项目被标记为「受信任」时加载
# 参考：https://learn.chatgpt.com/docs/config-file/config-basic

# 默认模型
model = "gpt-5.6"

# 执行命令前何时请求批准：on-request | untrusted | never
approval_policy = "on-request"

# 沙箱范围：read-only | workspace-write | danger-full-access
sandbox_mode = "workspace-write"
